<!doctype html>
<html lang="id">
  <head>
    <title>Visualizer Tree & Graph</title>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background: #111;
        color: #fff;
        padding: 20px;
      }
      .box {
        background: #222;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
        border: 1px solid #333;
      }
      .node {
        background: #deff9a;
        color: #000;
        padding: 8px 12px;
        display: inline-block;
        border-radius: 4px;
        font-weight: bold;
        margin: 5px;
      }
      .sub-tree {
        margin-left: 30px;
        border-left: 2px dashed #555;
        padding-left: 10px;
      }
      .accent-text {
        color: #deff9a;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h2>Demo Struktur Data Non-Linear</h2>

    <div class="box">
      <h3>1. Aplikasi Hierarki Folder (Tree Structure)</h3>
      <div id="treeView"></div>
    </div>

    <div class="box">
      <h3>2. Jaringan Pertemanan Sosial Media (Graph Structure)</h3>
      <div id="graphView"></div>
    </div>

    <script>
      // DATA TREE (Struktur Hierarki)
      const dataTree = {
        nama: "Menu Utama Website",
        anak: [
          { nama: "Home", anak: [] },
          { nama: "Produk", anak: [{ nama: "Pakaian" }, { nama: "Makanan" }] },
          { nama: "Kontak", anak: [] },
        ],
      };

      function renderTree(node, elemenTarget) {
        let div = document.createElement("div");
        div.innerHTML = `<span class="node">${node.nama}</span>`;
        elemenTarget.appendChild(div);

        if (node.anak && node.anak.length > 0) {
          let containerAnak = document.createElement("div");
          containerAnak.className = "sub-tree";
          div.appendChild(containerAnak);
          node.anak.forEach((child) => renderTree(child, containerAnak));
        }
      }
      renderTree(dataTree, document.getElementById("treeView"));

      // DATA GRAPH (Jejaring Bebas)
      const dataGraph = {
        Akun_Rian: ["Siti", "Budi"],
        Akun_Siti: ["Rian", "Dewi"],
        Akun_Budi: ["Rian"],
        Akun_Dewi: ["Siti"],
      };

      function renderGraph(graph, elemenTarget) {
        for (let user in graph) {
          let p = document.createElement("p");
          p.innerHTML = `<span class="node" style="background:#82ccdd">${user}</span> terhubung dengan teman: <span class="accent-text">${graph[user].join(", ")}</span>`;
          elemenTarget.appendChild(p);
        }
      }
      renderGraph(dataGraph, document.getElementById("graphView"));
    </script>
  </body>
</html>
